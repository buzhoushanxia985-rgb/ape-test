<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#0D0D0D; color:#E8E8E8; line-height:1.85; font-size:15px; padding-bottom:60px; }
.wrap { max-width:640px; margin:0 auto; }

.hero { padding:44px 24px 32px; background:linear-gradient(160deg,#141414,#0D0D0D); border-bottom:1px solid #222; }
.hero .badge { display:inline-block; background:#FFD700; color:#000; font-size:11px; font-weight:900; padding:5px 14px; border-radius:4px; letter-spacing:1px; margin-bottom:20px; }
.hero h1 { font-size:38px; color:#FFD700; font-weight:900; letter-spacing:1px; margin-bottom:12px; line-height:1.2; }
.hero .tag { font-size:13px; color:#888; letter-spacing:2px; margin-bottom:18px; }
.hero .line { font-size:17px; color:#DDD; line-height:1.7; }

.sec { padding:30px 24px; border-bottom:1px solid #1A1A1A; }
.kicker { font-size:10px; color:#666; letter-spacing:3px; margin-bottom:10px; font-weight:700; }
h2 { font-size:21px; color:#fff; font-weight:900; margin-bottom:18px; padding-bottom:10px; border-bottom:2px solid #FFD700; }
h2 em { font-style:normal; color:#FFD700; }
h3 { font-size:15px; color:#FFD700; font-weight:900; margin:20px 0 8px; }
p { margin-bottom:14px; color:#C8C8C8; text-align:justify; }
p b, li b { color:#FFD700; font-weight:700; }

.quote { background:#141414; border-left:4px solid #FFD700; padding:16px 18px; margin:18px 0; border-radius:4px; }
.quote p { margin:0; color:#E0E0E0; font-size:15px; }

.alert { background:#1F1414; border-left:4px solid #E63946; padding:16px 18px; margin:18px 0; border-radius:4px; }
.alert p { margin:0; color:#F0B0B0; }
.alert p b { color:#FF6B6B; }

table { width:100%; border-collapse:collapse; margin:16px 0; font-size:13px; }
th { background:#FFD700; color:#000; padding:10px 12px; text-align:left; font-weight:900; }
td { border-bottom:1px solid #222; padding:10px 12px; vertical-align:top; color:#C8C8C8; }
td b { color:#FFD700; }

ul.list { list-style:none; }
ul.list li { padding:14px 0 14px 30px; border-bottom:1px dashed #222; position:relative; color:#C8C8C8; }
ul.list li::before { content:"☐"; position:absolute; left:2px; color:#FFD700; font-size:17px; font-weight:900; }
ul.list li b { display:block; color:#fff; margin-bottom:4px; }

.foot { padding:30px 24px; text-align:center; font-size:12px; color:#555; line-height:2; }

.lock { padding:80px 30px; text-align:center; }
.lock .ico { font-size:46px; margin-bottom:20px; }
.lock h2 { border:none; text-align:center; font-size:19px; }
.lock p { text-align:center; color:#888; font-size:14px; line-height:1.9; }
.lock .hint { margin-top:26px; padding:16px; background:#141414; border-radius:8px; font-size:13px; color:#999; text-align:left; }
</style>
</head>

function b64ToBuf(b64) {
  // 兼容标准 base64 与 base64url 两种输入
  let s = String(b64).replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}

async function decrypt(cipherB64, keyStr, personKey) {
  // 与 Node 端保持一致：key = sha256(personKey + ":" + keyStr)
  const enc = new TextEncoder();
  const hash = await crypto.subtle.digest("SHA-256", enc.encode(personKey + ":" + keyStr));
  const raw = b64ToBuf(cipherB64);
  const iv = raw.slice(0,12);
  const data = raw.slice(12, raw.length-16);
  const tag = raw.slice(raw.length-16);
  const key = await crypto.subtle.importKey('raw', hash, {name:'AES-GCM'}, false, ['decrypt']);
  // WebCrypto 要求 tag 拼在密文尾部
  const merged = new Uint8Array(data.byteLength + tag.byteLength);
  merged.set(new Uint8Array(data), 0);
  merged.set(new Uint8Array(tag), data.byteLength);

  // iv 与 tag 都转为纯 ArrayBuffer，避免部分 Chrome 版本对 Uint8Array 视图处理不一致
  const ivBuf = new Uint8Array(iv).buffer;
  const dataBuf = merged.buffer.slice(0);

  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: ivBuf, tagLength: 128 },
    key,
    dataBuf
  );
  return new TextDecoder().decode(plain);
}

function parseHash() {
  // 同时支持 ?k=A&s=xxx 与 #k=A&s=xxx 两种写法
  const q = location.search || "";
  const h = location.hash || "";
  const src = q.length > 1 ? q.slice(1) : h.length > 1 ? h.slice(1) : "";
  const m = {};
  src.split("&").forEach((kv) => {
    const i = kv.indexOf("=");
    if (i > 0) m[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  return m;
}

}
