<script>
const DATA = [{"k":"A","name":"满仓战神","tag":"激进 · 进攻型 · 高风险偏好","line":"你的心脏是用来跳的，不是用来护盘的。","oneLine":"你最大的优势是敢下手，最大的风险是不知道什么时候该收手。","deep":"\n<p>你是市场里最有胆量的那一批人。别人算风险，你算赔率；别人想退路，你想加仓。这种气质在牛市里是印钞机——2020 年那波行情里，你这种打法的收益能翻倍甚至翻两倍。</p>\n<p>你的行为模式有三个清晰的特征：<b>决策快</b>——看到机会五分钟内就下单，从不纠结；<b>仓位重</b>——要么不做，要做就做绝；<b>复盘少</b>——赚了归功于眼光，亏了归咎于运气或市场。</p>\n<p>前两个是天赋。市场里 90% 的人死在犹豫和仓位太轻，你两样都不占。但第三个是定时炸弹：不复盘意味着你永远学不到教训，每一次成功都在强化同一个可能致命的习惯。</p>\n<p>真正的问题在于：<b>你大概率还没有被市场真正教育过</b>。真正的满仓战神都经历过一次深套——不是 10% 的回调，是 50% 起步的腰斩，那种让你半夜睡不着、不敢看账户、开始怀疑人生的跌。能扛过那次的人不到 5%，而且<b>没有一个是靠勇气扛过去的，都是靠仓位早就留了后路。</b></p>\n<p>你缺的不是技术，不是眼光，也不是胆量。你缺的是一套让你活下来的刹车系统。</p>","hidden":"\n<p>你以为自己在「承担风险」，其实你在「忽视风险」。这两者有本质区别：前者知道最坏情况是什么、并为此做好了准备；后者根本没想过最坏情况。</p>\n<p>你脑子里从没有认真出现过这个问题——<b>「如果我这笔交易错了，我会亏多少？」</b>一次都没有。你只算过「如果对了能赚多少」。</p>\n<p>更隐蔽的一层：你的成功经历在加固这个盲区。过去每次「梭哈——赚钱」都在告诉你「大胆是对的」，但其实是<b>牛市放大了你的正确率</b>，不是你的判断力。等市场风格切换，同一套打法会一次性还清所有盈利。</p>","risks":"\n<h3>① 单票梭哈的那一刻</h3>\n<p>朋友说某个票要翻倍，你把半年工资打进去。「这次不一样」是你对自己说过最多的话。结果没有例外：这种仓位结构只要错一次，前面赢的全还回去，还要倒欠。</p>\n<h3>② 越跌越补的那几个月</h3>\n<p>你把「补仓」当成信仰。跌 20% 补一次，跌 40% 再补，跌 60% 开始借钱补。你管这叫价值投资，市场管这叫接飞刀。真正的价值投资是<b>算过账的</b>，你不是。</p>\n<h3>③ 牛市末期最激进的时候</h3>\n<p>「别人恐惧我贪婪」是对的——但你在别人最贪婪时最贪婪。2021 年初满仓白酒、2015 年满仓加杠杆的人，画像和你一模一样。他们当时也觉得自己在抓风口。</p>","posTable":"\n<table>\n<tr><th style=\"width:22%\">仓位层</th><th style=\"width:18%\">建议比例</th><th>内容与纪律</th></tr>\n<tr><td><b>进攻仓</b></td><td>40%</td><td>你最有把握的 1–2 只标的。这里才是你发挥天赋的地方，但上限就是 40%。</td></tr>\n<tr><td><b>机动仓</b></td><td>30%</td><td>观察标的、波段操作、试错。亏损上限 -15%，触发无条件减仓。</td></tr>\n<tr><td><b>现金仓</b></td><td>30%</td><td>永远不动的现金。这是你的刹车。它的存在意义不是赚钱，是让你在暴跌时还有手可下。</td></tr>\n</table>","posNotes":"\n<div class=\"alert\">\n<p><b>你的现状：</b>进攻仓 90% 以上，现金仓接近 0。这不是激进，是<b>没有后路</b>。一旦满仓遇到深套，你唯一的选择就是死扛或割肉，而这两种结果都意味着失控。</p>\n</div>\n<h3>为什么现金仓必须存在</h3>\n<p>不是为了「等更好的机会」，是为了<b>保住你的决策能力</b>。满仓的人在下跌时会失去理智——因为每个决策都关系到生存。有 30% 现金的人，大脑是清醒的，能在底部做出正确判断。这 30% 买的不是收益，是清醒。</p>\n<h3>怎么开始</h3>\n<p>本周先减到 70% 仓位，把减出来的钱放进一个<b>不方便随时取用</b>的地方（比如定期、货币基金）。不方便取用是关键——你的问题不是不知道该留现金，是留不住。</p>","mistakes":"\n<h3>错误一：把「敢重仓」当成核心竞争力</h3>\n<p><b>后果：</b>一次致命错误抹平所有盈利，且无法恢复（因为亏 50% 需要赚 100% 才回本）。<br>\n<b>改法：</b>设单票上限 30%。不是建议，是硬规则，写在纸上贴屏幕。无论如何不加。</p>\n<h3>错误二：下跌时把「补仓」当纪律</h3>\n<p><b>后果：</b>在小概率的退市/暴雷事件中损失全部本金。<br>\n<b>改法：</b>补仓前必须回答三个问题：这家公司的基本面变了吗？它的下跌是市场性还是个体性？如果它继续跌 50%，我的总仓位会是多少？答不上来不补。</p>\n<h3>错误三：赚了不跑，还加仓</h3>\n<p><b>后果：</b>浮盈全数回吐，还倒亏（因为你在高位加了仓，成本被抬高）。<br>\n<b>改法：</b>预先写下止盈规则，比如「涨 50% 卖三分之一，涨 100% 再卖三分之一」。到点必卖，不商量。你得跟自己打赌，而不是跟市场打赌。</p>","checklist":"\n<li><b>本周：算出你的真实仓位结构</b>把所有持仓导出，算一下单票占比。哪只超过 30%，减到 30% 以下。不要心疼，这是止血。</li>\n<li><b>本月：建立现金仓</b>把 30% 的钱挪到一个不方便随时取用的地方。设成定期或货币基金，告诉自己：这笔钱不到市场崩盘不动。</li>\n<li><b>本季：写下止损线并贴墙</b>单票最大亏损 -15%，触发无条件减仓。写完拍照存手机，每次想「再拿一下」的时候看一眼。</li>\n<li><b>本年：完整走完一次深亏并复盘</b>当你经历一次单月亏损超过 20%，强制休息两周不操作。这两周里写下来：我错在哪一步？</li>\n<li><b>每笔交易前：写 50 字交易理由</b>买什么、为什么现在、错了怎么退。三个问题写不出来，就不买。这一条能挡掉你 70% 的冲动交易。</li>","strategy":"\n<h3>适合你的打法</h3>\n<p><b>集中 + 严格止损的进攻型。</b>你不需要分散到 20 只股票（那会浪费你的胆量），你需要的是「少数高确信标的 + 铁一样的退出纪律」。你的优势在于敢下重手，那就把重手用在真正算过账的机会上。</p>\n<h3>适合做什么</h3>\n<p>▸ 有明确催化剂的行业龙头，重仓但设硬止损<br>\n▸ 周期股（你天然能扛住周期波动，别人扛不住）<br>\n▸ 自己深度研究过的少数标的，长期持有核心仓</p>\n<h3>别碰什么</h3>\n<p>▸ 杠杆（融资融券、场外配资）——杠杆会把你 50% 的回撤变成爆仓<br>\n▸ 无业绩支撑的题材股——你的仓位结构撑不住一次归零<br>\n▸ 借钱投资——这是最快让你从「战神」变成「难民」的方式</p>"},{"k":"B","name":"定投老农","tag":"稳健 · 纪律型 · 长期主义","line":"别人追涨杀跌，你在种地。秋天见。","oneLine":"你有全场最好的纪律，但纪律解决不了「买错了东西」。","deep":"\n<p>你是市场里最让人羡慕的一类人：有纪律、有耐心、不贪。你定的规则会执行，你定的目标会等，市场涨你不追，市场跌你也不慌。</p>\n<p>这份从容不是天生的，是你用时间换来的。过去十年，坚持定投宽基指数的人年化收益 6–9% 不算难——<b>这已经跑赢了 70% 的主动操作者</b>，而那些人每天盯盘 4 小时。</p>\n<p>但你的问题恰恰藏在优点里：<b>纪律的反面是僵化，耐心的反面是迟钝。</b>你会因为「规则说继续」而无视基本面已经变化的事实；会因为「长期主义」而拒绝承认错误。你最大的功课不是学新招，是给纪律加一个年度审查开关。</p>\n<p>顺便说，你这种人在市场里的寿命通常最长——不是因为赚得多，是因为不会死。这本身就是一种极高的竞争优势。</p>","hidden":"\n<p>你把「长期持有」当成了免死金牌。<b>纪律解决的是「怎么买」，不解决「买什么」。</b></p>\n<p>2021 年开始定投中概互联三年的人，多数是你这种类型。他们不是输在不够坚持，恰恰相反——他们太坚持了。他们输在从没问过一句：「我定投的这东西本身还对吗？」</p>\n<p>坚持错的方向，只是让你更快到达错误的目的地。<b>而且因为你一路在加仓，你到达得比别人更惨烈。</b></p>","risks":"\n<h3>① 某个持仓变质了，但你因为「规则」而无视它</h3>\n<p>可能是行业逻辑变了，可能是管理层换了，可能只是它不再是你当初买它的理由。你看到了，但你告诉自己「定投就是不动」。这不是纪律，这是逃避思考。</p>\n<h3>② 收益翻倍了还拿着，把「长期主义」当不止盈的借口</h3>\n<p>A 股不是美股，牛短熊长。你把一轮完整的过山车坐完，浮盈归零，然后安慰自己「长期看还是会涨」。长期确实会涨，但你的这轮钱已经浪费了五年。</p>\n<h3>③ 三年前的持仓今天还在，你却说不清它是什么</h3>\n<p>你以为你在长期持有，其实你在持有遗忘。当持仓变成「懒得改」的结果，它就不再是策略，而是惯性。</p>","posTable":"\n<table>\n<tr><th style=\"width:22%\">仓位层</th><th style=\"width:18%\">建议比例</th><th>内容与纪律</th></tr>\n<tr><td><b>定投仓</b></td><td>50%</td><td>宽基指数，每月固定金额，不因涨跌改变。</td></tr>\n<tr><td><b>主动仓</b></td><td>20%</td><td>允许自己「手痒」的部分，上限 20%。超过就砍，防止手痒毁掉整体纪律。</td></tr>\n<tr><td><b>防守仓</b></td><td>30%</td><td>债券 / 货币 / 存款。这部分不是用来赚钱的，是用来让你在暴跌时睡得着觉的。</td></tr>\n</table>","posNotes":"\n<div class=\"alert\">\n<p><b>你的现状：</b>定投仓占比 70–80%，但<b>没有任何审查机制</b>。你可能连续三五年没认真看过自己定投的是什么东西了。</p>\n</div>\n<h3>关键不在比例，在「审查」</h3>\n<p>你的仓位结构其实很健康，比例问题不大。真正的问题在：**没有审查的定投，等于没有驾驶的自动驾驶**。它会一直往前开，但可能开向悬崖。</p>\n<h3>审查日怎么定</h3>\n<p>选一个你绝对不会忘的日子——生日、年终、发年终奖那天。每年这天，做一件事：把每个定投标的拿出来，问一句<b>「如果今天我从零开始，我还会买它吗？」</b>。会，继续；不会，设一个退出计划。一年一次，一次一小时，就够。</p>","mistakes":"\n<h3>错误一：把纪律用在错误标的上</h3>\n<p><b>后果：</b>越定投亏越多，还自我安慰「成本摊低了」。定投解决择时，不解决标的好坏。<br>\n<b>改法：</b>建仓前先过三个筛子：这个指数/基金过去十年的长期趋势向上吗？它的费率合理吗？它跟踪的东西我真的理解吗？</p>\n<h3>错误二：从不主动止盈</h3>\n<p><b>后果：</b>过山车坐完，浮盈归零，还浪费了时间成本。<br>\n<b>改法：</b>给自己定一个「再平衡」规则：当某类资产占比偏离目标 10 个百分点以上时，强制调回。这不是止盈，是纪律性再平衡，心理上更容易接受。</p>\n<h3>错误三：把主动仓变成「随口一句就买」</h3>\n<p><b>后果：</b>20% 的主动仓可能贡献 80% 的亏损（老农型最容易犯的错，因为平时太稳，一出手就重）。<br>\n<b>改法：</b>主动仓也要有规则：单笔不超过总资金 3%，错了止损，对了不加。</p>","checklist":"\n<li><b>本周：列出所有定投标的</b>写上「今天我还会开始买它吗」的答案。答「不确定」的，标记出来。</li>\n<li><b>本月：为答「否」的标的设退出计划</b>不是一次性清仓，是分批退出（比如分三个月卖完）。给它一个体面的退场，也给你自己一个缓冲。</li>\n<li><b>本季：定下你的年度审查日</b>写在日历上，加手机提醒。日期选你最不容易忘的那天。</li>\n<li><b>本年：给主动仓设上限</b>建议 20%，超了就砍。你的优势是纪律，别让 20% 的手痒毁掉 80% 的纪律。</li>\n<li><b>长期：接受一个事实</b>收益上限取决于你买的是什么，不取决于你坚持了多久。选择比坚持更重要，你缺的从来都是这个认知。</li>","strategy":"\n<h3>适合你的打法</h3>\n<p><b>核心卫星策略。</b>核心（70%）= 宽基指数长期定投，不用管；卫星（30%）= 少量主动配置，允许自己试错但设上限。你的优势在于能长期拿住，那就把它用在真正值得长期的东西上。</p>\n<h3>适合做什么</h3>\n<p>▸ 宽基指数定投（沪深300、中证A500 一类）<br>\n▸ 有明确长期趋势的行业 ETF（不是概念，是真实的产业趋势）<br>\n▸ 债券 / 货币基金打底，让你在市场暴跌时还能保持冷静</p>\n<h3>别碰什么</h3>\n<p>▸ 主题型热门基金（你不擅长择时，买在高位的概率很大）<br>\n▸ 主动管理型基金（你的纪律会掩盖基金经理的不作为）<br>\n▸ 频繁切换标的（这是对纪律的破坏，也是最容易让你从「老农」变成「猎人」的方式）</p>"},{"k":"C","name":"惊弓之鸟","tag":"极保守 · 风控型 · 低风险耐受","line":"你的投资策略只有四个字：落袋为安。","oneLine":"你不是胆小，是仓位和你能承受的波动不匹配。","deep":"\n<p>你是市场里最痛苦的一类人：想赚钱，但受不了亏钱。跌 1% 睡不着，跌 5% 清仓，跌 10% 开始怀疑人生。</p>\n<p>最讽刺的是：<b>你每次清仓的位置，往往是短期底部。</b>不是你判断准，是所有人都和你一样在那时恐慌，而恐慌的尽头就是反弹的起点。</p>\n<p>你的核心问题不是胆小，是<b>仓位和你能承受的波动不匹配</b>。你用能承受 5% 波动的神经，扛着会波动 30% 的资产——痛苦是必然的，不是偶然的。</p>\n<p>但换个角度看，你的风险厌恶是真实的天赋。它意味着你天然适合做资产配置，你会在别人贪婪时保持清醒。<b>你只是从来没按这个天赋配置过</b>——你一直在用错误的方式惩罚自己的谨慎。</p>","hidden":"\n<p>你亏的不是钱，是<b>机会成本</b>。过去十年你大概率跑输通胀，而且你心里清楚。每次看到别人晒收益你会难受一下，然后告诉自己「我不适合投资」。</p>\n<p>这个结论是错的。不是你不适合投资，是你<b>从来没被允许用一种适合你的方式投资</b>。所有人都在教你怎么「敢冒险」，没人教你「怎么在低风险下也能获得合理回报」。</p>\n<p>你的隐性问题：<b>你一直在用错误的标准评判自己。</b>你用「收益率」评价自己，而你真正的优势是「不亏损的稳定性」。</p>","risks":"\n<h3>① 下跌 8–10% 时的「割肉解脱感」</h3>\n<p>那一刻你会觉得「终于不用煎熬了」——然后市场开始反弹。你可以统计一下过去每次清仓的位置，大概率每次都是短期底部。你的问题不是判断力差，是<b>你从来没有用「亏光也不心疼」的钱去练手</b>，所以每次波动都像第一次经历。</p>\n<h3>② 反弹时不敢上车，涨到 20% 时才追</h3>\n<p>清仓后市场反弹，你看着它涨，不敢追。等涨了 20%，终于忍不住进去了——买在短期顶部。然后重复第一次的痛苦循环。</p>\n<h3>③ 频繁从「激进」切换到「更稳」的产品</h3>\n<p>股票换基金，基金换债券，债券换存款。每次都对自己说「这次稳了」，每次都跑输通胀。<b>你在用不断降级的方式逃避风险，最终逃到的位置是「钱在贬值」。</b></p>","posTable":"\n<table>\n<tr><th style=\"width:22%\">仓位层</th><th style=\"width:18%\">建议比例</th><th>内容与纪律</th></tr>\n<tr><td><b>安心仓</b></td><td>70%</td><td>货币基金 / 大额存单 / 国债。这部分永远不看涨跌，当作不存在。</td></tr>\n<tr><td><b>练手仓</b></td><td>20%</td><td>亏光也不心疼的钱。用来体验完整的波动周期，建立对市场的真实认知。</td></tr>\n<tr><td><b>观察仓</b></td><td>10%</td><td>模拟盘或极小仓位。只看不买，用来观察市场，不动情绪。</td></tr>\n</table>","posNotes":"\n<div class=\"alert\">\n<p><b>你的现状：</b>可能 100% 全在场内，或者 100% 全在货币基金。<b>两个极端都是问题</b>——前者让你痛苦，后者让你跑输通胀。</p>\n</div>\n<h3>为什么必须 70% 放安心仓</h3>\n<p>因为你需要「睡眠权」。一个能睡好觉的人，才能做出理性决策。70% 放在你完全不用担心的地方，剩下的 20% 才是你真正在「投资」的部分——20% 的波动，对你的生活影响有限，对心态的影响也可控。</p>\n<h3>练手仓的意义</h3>\n<p>它的目的不是赚钱，是<b>花小钱买经验</b>。用这 20% 走完一次完整的「买入-下跌-持有-回升」周期，你会发现自己原来能扛住，或者确认自己真的不适合。两种结果都是收获。</p>","mistakes":"\n<h3>错误一：用全部资金去承受无法承受的波动</h3>\n<p><b>后果：</b>每次下跌都产生强制决策压力，最终在最差的位置卖出。<br>\n<b>改法：</b>先把仓位降到让你「跌 10% 也不失眠」的水平。做不到就继续降。</p>\n<h3>错误二：把「不亏钱」当成唯一目标</h3>\n<p><b>后果：</b>十年下来收益跑输通胀，购买力实质下降。「不亏」变成了「慢性失血」。<br>\n<b>改法：</b>定一个最低目标：年化跑赢通胀 2 个点。这个目标不高，但要求你至少有一部分资产在市场里。</p>\n<h3>错误三：每次痛苦就换产品，从不复盘</h3>\n<p><b>后果：</b>永远停在同一个循环里，十年没有任何长进。<br>\n<b>改法：</b>记录每次卖出时的心理状态和当时的市场位置。冷静后回看，你会看到自己的模式。</p>","checklist":"\n<li><b>本周：把场内资金降到「跌 10% 不失眠」的水平</b>不用一步到位，先降一半。</li>\n<li><b>本月：建立安心仓</b>把 70% 的钱放进货币基金或大额存单，卸载那个 App（真的，卸载）。</li>\n<li><b>本季：用练手仓体验一次完整周期</b>用 20% 的钱，完整走一次「买入-下跌-持有-回升」。记录每一步的心情。</li>\n<li><b>本年：统计你的历史清仓位置</b>把过去 3 年每次卖出的位置和之后 30 天的走势画出来。你会看到那个模式，然后才会真正相信它。</li>\n<li><b>长期：承认「我的目标不是赚最多」</b>你的目标是不亏大钱、跑赢通胀、晚上睡得着。这不是妥协，是认清自己。</li>","strategy":"\n<h3>适合你的打法</h3>\n<p><b>资产配置驱动。</b>不要做选股，不要做择时，做配置。设定一个固定的股债比例（比如 20:80），每年再平衡一次。你的优势在于能长期持有低波动资产，那就把它变成系统。</p>\n<h3>适合做什么</h3>\n<p>▸ 货币基金 / 国债 / 大额存单作为主力（70%）<br>\n▸ 债券基金（波动小，你能拿得住）<br>\n▸ 宽基指数定投（用极小的金额，长期小步慢跑）</p>\n<h3>别碰什么</h3>\n<p>▸ 个股（一只股票的波动会让你彻夜难眠）<br>\n▸ 杠杆、期货、外汇（这些是给你最怕的类型准备的毒药）<br>\n▸ 任何需要「盯盘」的产品——你盯盘只会增加痛苦，不会增加收益</p>"},{"k":"D","name":"消息面猎人","tag":"跟风 · 依赖型 · 外部驱动","line":"你的钱是别人的观点赚走的。","oneLine":"你缺的不是信息，是决策框架。","deep":"\n<p>你买卖的依据不是逻辑，是「谁说的」。博主说下一个十倍股，你上车；股吧喊崩，你跑路。你手机里存着 20 个财经博主，每天刷 3 小时行情资讯。</p>\n<p><b>但你的账户曲线和你的信息量完全不成正比。</b>这不奇怪，因为你收到的信息和所有人同时收到——你以为的信息优势，其实是信息噪音。</p>\n<p>核心问题：<b>你在用别人的观点，承担自己的亏损。</b>博主说错了，他掉粉；你跟错了，你亏钱。这个不对称你从来没算过账。</p>\n<p>你也并不笨。你只是还没建立自己的判断系统，所以只能借别人的。这不丢人——但借来的观点，不能持久。</p>","hidden":"\n<p>你有个错觉：<b>信息越多 = 优势越大。</b>实际上你获取信息越快，亏得越快。</p>\n<p>因为你收到的「机会」和所有人同时收到，而你的对手盘往往就是发消息的人。他们需要有人接盘，你就是那个人。</p>\n<p>真正值得看的不是「机会」，是「逻辑」：他为什么这么判断、依据是什么、错了会怎么退。<b>这三个问题你从来没问过。</b>你只看结论。</p>","risks":"\n<h3>① 某个大V突然开始「带节奏」的那天</h3>\n<p>他会给你一个听起来无懈可击的故事，配上「名额有限」「最后上车机会」的紧迫感，你 10 分钟内就会做出决策——而这个决策平时你需要研究一个月才敢做。你不是被他骗了，是被自己的焦虑骗了。</p>\n<h3>② 跟单亏了之后立刻换一个博主</h3>\n<p>上个博主让你亏了，你换一个。但问题不在博主在框架——<b>你换谁结果都一样</b>，因为你的决策流程还是一样的。</p>\n<h3>③ 把「听到了」当成「研究过」</h3>\n<p>你对某只股票的全部了解只有一句话：「XX 说它能到 30 块」。连它是做什么业务、今年利润多少、竞争对手是谁，你都说不上来。这不叫投资，这叫押注一个陌生人的判断力。</p>","posTable":"\n<table>\n<tr><th style=\"width:22%\">仓位层</th><th style=\"width:18%\">建议比例</th><th>内容与纪律</th></tr>\n<tr><td><b>指数仓</b></td><td>60%</td><td>跟踪宽基指数。不依赖任何人的观点，是你的压舱石。</td></tr>\n<tr><td><b>验证仓</b></td><td>25%</td><td>别人推荐的标的。必须通过「三问清单」才允许买入，没通过就零仓。</td></tr>\n<tr><td><b>现金仓</b></td><td>15%</td><td>应对判断失败后的补仓或退出，也是你的心理缓冲。</td></tr>\n</table>","posNotes":"\n<div class=\"alert\">\n<p><b>你的现状：</b>验证仓 = 100%，指数仓 = 0。你的所有资产都在赌别人的判断，而赌注是你自己的钱。</p>\n</div>\n<h3>三问清单（每个字都要答）</h3>\n<p><b>问1：</b>这个东西具体是什么？赚钱模式是什么？<br>\n<b>问2：</b>为什么是现在买？催化事件是什么？<br>\n<b>问3：</b>如果判断错了，我在哪里退出？最大亏损多少？</p>\n<p>三个问题答不完整，就不买。这不是建议，是硬门槛。你自己写下来的答案，比任何博主的判断都可靠。</p>","mistakes":"\n<h3>错误一：追热点消息</h3>\n<p><b>后果：</b>消息到你手里时已经是最贵的时候。你以为的先手，其实是接盘。<br>\n<b>改法：</b>任何消息先等 24 小时。真正的好机会不会在 24 小时内跑掉，会跑掉的都是陷阱。</p>\n<h3>错误二：把「信任某个博主」当成投资决策</h3>\n<p><b>后果：</b>他的判断失误会直接变成你的损失，而他已经赚到了流量。<br>\n<b>改法：</b>看博主只看逻辑，不看结论。他讲的对不对，你自己判断；他只讲结论不讲逻辑，取关。</p>\n<h3>错误三：亏了之后换人，从不改方法</h3>\n<p><b>后果：</b>在同一类错误里循环十年，每次都觉得「这次找对人了」。<br>\n<b>改法：</b>建立交易日志，记录每次买入的理由来源。三个月后回看，你会发现大部分亏损来自同一类决策。</p>","checklist":"\n<li><b>本周：取关一半财经博主</b>留下的标准只有一条：他讲逻辑不讲标的。讲「买什么」的取关，讲「为什么」的留下。</li>\n<li><b>本月：写下你的三问清单</b>手写，贴在你下单的屏幕旁边。每次下单前必须答完三问。</li>\n<li><b>本季：把指数仓建到 60%</b>用规则替代观点。这部分钱不看任何博主，只看指数。</li>\n<li><b>本年：统计你的跟单胜率</b>翻你的交易记录，算一下「跟着别人买的」赚钱比例。低于 50% 的，停止跟单。</li>\n<li><b>长期：记住一句话</b>你的信息优势是幻觉，你的对手盘就是给你发消息的人。</li>","strategy":"\n<h3>适合你的打法</h3>\n<p><b>指数为主 + 严格验证的卫星仓。</b>你的问题不是缺乏信息，是缺乏过滤。用 60% 的指数仓稳定基本盘，用 25% 的验证仓满足你对机会的渴望——但每一次都必须通过三问。</p>\n<h3>适合做什么</h3>\n<p>▸ 宽基指数（核心，不依赖任何人的判断）<br>\n▸ 行业 ETF（比个股风险低，也比个股更容易验证）<br>\n▸ 少量自己真正研究过的个股（研究的标准是三问答得出来）</p>\n<h3>别碰什么</h3>\n<p>▸ 「内部消息」「小道消息」——这些信息存在的唯一目的就是让你接盘<br>\n▸ 荐股群、付费社群——你付费买的是别人的判断，承担的是自己的风险<br>\n▸ 短线高频——你的决策依赖外部信息，短线会让你暴露在最密集的信息噪音中</p>"},{"k":"E","name":"躺平佛系","tag":"被动 · 长期型 · 低参与度","line":"你不理财，财不理你；你一理财，财离开你。","oneLine":"你不缺心态，你缺的是一次认真的一年一体检。","deep":"\n<p>你是全场心态最好的人。买了就忘，跌了不看，涨了也不知道。别人焦虑你不焦虑，别人失眠你不失眠。</p>\n<p><b>从心态上讲，你已经赢了 80% 的投资者。</b>大部分亏损来自频繁操作和情绪决策，而你恰好两样都不做。</p>\n<p>但「躺平」和「放任」是两回事：躺平是主动选择后不管，放任是从来没管过。你大概率是后者——买了一堆不知道为什么买的基金，收益不知道，回撤不知道，甚至忘了自己在哪个平台买的。</p>\n<p>好消息是：你的问题最好解决。不需要你变成盯盘的人，只需要一年花一个下午。</p>","hidden":"\n<p>你最大的隐性成本是<b>「沉默的烂持仓」</b>。那些你忘了的、不想看的、说不出为什么买的账户和基金，正在悄悄拖垮你的整体收益。</p>\n<p>它们不是「放着没事」，是<b>每年都在替你做错误的决策</b>。你从不卖，不是因为看好，是因为懒——而懒在这里不中性，是负的。</p>\n<p>市场不会因为你不看它而善待你。它会安静地拿走你的钱，直到你某天想起来看一眼。</p>","risks":"\n<h3>① 某个你完全忘了的账户里，一只基金已经跌了 60%</h3>\n<p>这不是吓你，是真实高频发生的事。定投扣款失败三个月没人发现、平台清盘了没人通知、基金经理换了你都不知道。</p>\n<h3>② 你以为的「定投」其实早就停了</h3>\n<p>银行卡余额不足三个月，扣款失败，定投自动停止。你以为自己在坚持定投三年，实际上第二个月就断了。这种事你永远发现不了，因为你不看账单。</p>\n<h3>③ 持有单一产品比例过高，而你以为自己很分散</h3>\n<p>「我买了好几只基金啊」——但它们可能跟踪同一个指数、持有同一批股票、由同一个基金经理管。你以为的分散，其实是同一个风险重复下注。</p>","posTable":"\n<table>\n<tr><th style=\"width:22%\">仓位层</th><th style=\"width:18%\">建议比例</th><th>内容与纪律</th></tr>\n<tr><td><b>核心仓</b></td><td>60%</td><td>1–2 只宽基指数，长期持有，不用管。</td></tr>\n<tr><td><b>整理仓</b></td><td>30%</td><td>你现在那些「说不清是什么」的持仓，逐步并入核心仓。</td></tr>\n<tr><td><b>现金仓</b></td><td>10%</td><td>应急资金，随时可取。</td></tr>\n</table>","posNotes":"\n<div class=\"alert\">\n<p><b>你的现状：</b>核心仓 = 0，整理仓 = 100%。所有资产都在「说不清」的状态里。<b>你不需要学会投资，你需要学会整理。</b></p>\n</div>\n<h3>一年一次，一个下午</h3>\n<p>把这一天定下来（建议发年终奖那天），做三件事：<br>\n1. 找出所有账户（包括你忘了密码的）<br>\n2. 导出所有持仓，做成一张表<br>\n3. 每一项问「今天我还会买它吗」——不会的标记出来</p>\n<p>就这三件事，做完这一年就结束。剩下的时间你可以继续躺平。</p>","mistakes":"\n<h3>错误一：账户失联</h3>\n<p><b>后果：</b>你的资产在你看不见的地方缩水，而你连损失了多少都不知道。<br>\n<b>改法：</b>本周把所有账户找出来，写在一张纸上，贴在抽屉里。</p>\n<h3>错误二：定投扣款失败没人管</h3>\n<p><b>后果：</b>你以为在定投，实际上三个月就停了，白等三年。<br>\n<b>改法：</b>手机设一个季度提醒，每次检查一次扣款记录。</p>\n<h3>错误三：以为「买了好几只」就是分散</h3>\n<p><b>后果：</b>同一个风险重复下注，实际集中度远超你的想象。<br>\n<b>改法：</b>看每只基金的前十大持仓，重复的合并掉。</p>","checklist":"\n<li><b>本周：把所有账户找出来</b>包括那些忘了密码的。写在一张纸上，贴在你每天能看到的地方。</li>\n<li><b>本月：每个账户导出持仓，做一张总表</b>一张表，所有账户，所有标的，所有金额。</li>\n<li><b>本季：总表里每项问「今天还会买吗」</b>答「不会」的标记出来，不用立刻卖，先标记。</li>\n<li><b>本年：定一个年度体检日</b>建议发年终奖那天。每年一次，一次一个下午，雷打不动。</li>\n<li><b>长期：把标记「不会买」的逐步换成 1–2 只宽基</b>让它变成 60% 的核心仓。你不擅长选股，但你很擅长不动——那就用它。</li>","strategy":"\n<h3>适合你的打法</h3>\n<p><b>极简三基金。</b>1 只宽基指数（A股）+ 1 只宽基指数（全球或美股）+ 1 个货币基金做现金仓。三种资产，一个比例，每年再平衡一次。就这么多。</p>\n<h3>适合做什么</h3>\n<p>▸ 宽基指数（沪深300、中证A500、标普500 一类）<br>\n▸ 目标日期基金（自动配置、自动再平衡，最符合你的性格）<br>\n▸ 大额存单 / 货币基金（现金仓，应急用）</p>\n<h3>别碰什么</h3>\n<p>▸ 主题基金、行业基金——你买了不会管，而它们需要持续跟踪<br>\n▸ 个股——买了不看等于赌博<br>\n▸ 任何需要「研究」的产品——你不会研究，那就别碰</p>"}];

function getParam(n) {
  const m = new URLSearchParams(location.search);
  return m.get(n);
}

function render() {
  const app = document.getElementById('app');
  const key = getParam('k');
  const name = getParam('p');

  let item = null;
  if (key) item = DATA.find(d => d.k.toUpperCase() === key.toUpperCase());
  if (!item && name) item = DATA.find(d => d.name === name);

  if (!item) {
    app.innerHTML = '<div class="sec"><h2>请选择你的人格</h2>' +
      DATA.map(d => '<p style="padding:14px 0;border-bottom:1px solid #222">' +
        '<b style="font-size:17px">' + d.name + '</b><br>' +
        '<span style="color:#888;font-size:13px">' + d.tag + '</span></p>').join('') +
      '</div>';
    return;
  }

  app.innerHTML = `
  <div class="hero">
    <div class="badge">A股投资者风险人格 · 详细报告</div>
    <h1>${item.name}</h1>
    <div class="tag">${item.tag}</div>
    <div class="line">${item.line}</div>
  </div>

  <div class="sec">
    <div class="kicker">PART 01 / 人格深度分析</div>
    <h2>你是谁：<em>${item.name}</em>的完整画像</h2>
    ${item.deep}
    <div class="quote"><p><b>一句话总结：</b>${item.oneLine}</p></div>
  </div>

  <div class="sec">
    <div class="kicker">PART 02 / 你没意识到的事</div>
    <h2>隐性问题</h2>
    ${item.hidden}
  </div>

  <div class="sec">
    <div class="kicker">PART 03 / 三个致命瞬间</div>
    <h2>你最可能栽在这里</h2>
    ${item.risks}
  </div>

  <div class="sec">
    <div class="kicker">PART 04 / 仓位诊断</div>
    <h2>你该有的仓位结构</h2>
    ${item.posTable}
    ${item.posNotes}
  </div>

  <div class="sec">
    <div class="kicker">PART 05 / 三个必须改的错误</div>
    <h2>改错清单</h2>
    ${item.mistakes}
  </div>

  <div class="sec">
    <div class="kicker">PART 06 / 行动清单</div>
    <h2>从本周开始做什么</h2>
    <ul class="list">${item.checklist}</ul>
  </div>

  <div class="sec">
    <div class="kicker">PART 07 / 策略画像</div>
    <h2>适合你的打法</h2>
    ${item.strategy}
  </div>

  <div class="foot">
    本报告基于 10 道人格测试题生成<br>
    仅供自我认识参考，不构成任何投资建议<br>
    投资有风险，决策需独立
  </div>
  `;
}

render();
</script>
</body>
</html>
